/* Layout: one quiet column — the log line and the boat's gauges on top, the diorama at a modest fixed scale in the middle,
   the crate on the hook and the one action (sail) below. Rules live behind a small button. Text sizes are snapped from script
   to whole multiples of the font's 12px grid in device pixels. */
:root {
  --mist: #e6ecee;      /* page, and the paper the diorama dissolves into (same as the canvas background) */
  --ink: #1d2a33;
  --ink-soft: #5f6f78;
  --buoy: #e2622f;      /* accent: buoy orange */
  --rope: #cbb995;      /* gauge track */
  --danger: #c8393b;
  --px: 'DockPixel', 'PingFang SC', 'Microsoft YaHei', monospace;
  --t0: 12px;           /* small print */
  --t1: 12px;           /* running text */
  --t2: 24px;           /* title and the day's money */
  color-scheme: light;
}
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; box-sizing: border-box; background: var(--mist); color: var(--ink); font-family: var(--px); font-size: var(--t1); line-height: 1.4;
  -webkit-font-smoothing: none; font-synthesis: none; font-weight: 400;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
}
b { font-weight: 400; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 28px; max-width: 900px; width: 100%; margin: 0 auto; }
.top { padding-block: 16px 4px; position: relative; z-index: 25; }  /* stays clickable above the manifest overlay */
h1 { font-size: var(--t2); font-weight: 400; margin: 0; line-height: 1; }
.stat { display: flex; align-items: baseline; gap: 8px; color: var(--ink-soft); white-space: nowrap; }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.stat.warn b { color: var(--danger); }
.spacer { flex: 1; }
.tools { display: flex; gap: 10px; align-items: center; }
.gauges { padding-block: 8px; }
.gauge { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); white-space: nowrap; }
.track { position: relative; width: 108px; height: 10px; background: var(--rope); }
.track .zone { position: absolute; top: 0; bottom: 0; background: var(--danger); opacity: .45; }
.track .needle { position: absolute; top: -4px; width: 4px; height: 18px; background: var(--ink); transform: translateX(-2px); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.gauge b { color: var(--ink); min-width: 5.5em; font-variant-numeric: tabular-nums; }
.gauge.warn b { color: var(--danger); }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
canvas { display: block; image-rendering: pixelated; touch-action: none; outline: none; cursor: crosshair; }
canvas.icon { image-rendering: pixelated; flex: none; cursor: default; }
/* on touch screens the whole page is the crane's trackpad: no scrolling or zoom gestures there */
header, .gauges, #stage, footer { touch-action: none; }
.touch-only { display: none; }
@media (pointer: coarse) { .touch-only { display: inline-block; } }
#toast { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--ink); color: var(--mist); padding: 6px 14px; white-space: nowrap; pointer-events: none; transition: opacity .25s; }
#toast[data-show="0"] { opacity: 0; }
.bottom { padding-block: 6px max(18px, env(safe-area-inset-bottom, 0px)); }
.hook { display: flex; align-items: center; gap: 14px; min-width: 0; }
#cIcon { width: 48px; display: flex; align-items: center; justify-content: center; flex: none; }
.hook .sub { color: var(--ink-soft); font-size: var(--t0); }
.btns { display: flex; gap: 10px; flex: none; }
@media (max-width: 640px) { .bottom { flex-wrap: nowrap; } .bottom .spacer { display: none; } .hook { flex: 1; } button { padding: 6px 12px; } }
button { font: inherit; padding: 6px 18px; border: 3px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
button.primary { background: var(--buoy); border-color: var(--buoy); color: #fff; }
button.small { font-size: var(--t0); padding: 2px 10px; border-width: 2px; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }
/* rules: a small button; the card shows on hover, keyboard focus, or a tap (data-open) */
.tip { position: relative; }
.tip-body { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(340px, calc(100vw - 32px)); background: var(--mist);
  border: 3px solid var(--ink); padding: 12px 14px; font-size: var(--t0); color: var(--ink); white-space: normal; }
.tip:hover .tip-body, .tip:focus-within .tip-body, .tip[data-open="1"] .tip-body { display: block; }
.tip-body ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tip-body li { padding-left: 1em; text-indent: -1em; }
.tip-body li::before { content: '· '; }
.tip-body em { font-style: normal; color: var(--buoy); }
#over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(230, 236, 238, .9); padding: 12px; z-index: 20; }
#over .card { background: var(--mist); border: 3px solid var(--ink); padding: 18px 20px; width: min(460px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
#over h2 { font-size: var(--t2); font-weight: 400; margin: 0; line-height: 1.1; }
#over p { margin: 0; color: var(--ink-soft); }
#over p.warn { color: var(--danger); }
#over p.total { color: var(--ink); font-size: var(--t2); }
.manifest { border-collapse: collapse; width: 100%; }
.manifest th { font-weight: 400; color: var(--ink-soft); font-size: var(--t0); text-align: left; padding: 0 8px 4px 0; }
.manifest td { padding: 3px 8px 3px 0; vertical-align: middle; }
.manifest td.ic { width: 1%; }
.manifest td.num, .manifest th.num { text-align: right; padding-right: 0; font-variant-numeric: tabular-nums; }
.wbar { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 6px; }
.wbar i { width: 6px; height: 10px; background: var(--ink); }
.wbar i.off { background: var(--rope); }
.ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ledger li { display: flex; gap: 12px; align-items: baseline; }
.ledger .mid { color: var(--ink-soft); flex: 1; }
@media (max-width: 640px) {
  .row { gap: 6px 16px; }
  .top { padding-top: 10px; }
  .track { width: 70px; }
  .gauge b { min-width: 0; }
}
</style>
</head>
<body>


<header class="row top">
  <h1 data-i18n="title">Dockhand</h1>
  <div class="stat"><span id="hBoat"></span><b id="hBoatName"></b></div>
  <div class="stat money"><span data-i18n="today">Today</span> <b id="hScore">0</b></div>
  <div class="stat"><span data-i18n="thisBoat">This boat</span> <b id="hBoatVal">0</b></div>
  <div class="stat" id="cTide" hidden><span data-i18n="tide">Tide</span> <b id="hTide"></b></div>
  <div class="spacer"></div>
  <div class="tools">
    <div class="tip" id="tip">
      <button class="small" id="bRules" type="button" aria-describedby="rules" data-i18n="rules">Rules</button>
      <div class="tip-body" id="rules" role="tooltip">
        <ul id="rulesList"></ul>
      </div>
    </div>
    <button class="small" id="lang" type="button"></button>
    <button class="small" id="mute" type="button" aria-pressed="false"></button>
  </div>
</header>
<div class="row gauges">
  <div class="gauge" id="gRoll"><span data-i18n="roll">Roll</span> <div class="track"><div class="zone" style="left:0"></div><div class="zone" style="right:0"></div><div class="needle" id="nRoll" style="left:50%"></div></div> <b id="vRoll">0°</b></div>
  <div class="gauge" id="gPitch"><span data-i18n="pitch">Pitch</span> <div class="track"><div class="zone" style="left:0"></div><div class="zone" style="right:0"></div><div class="needle" id="nPitch" style="left:50%"></div></div> <b id="vPitch">0°</b></div>
  <div class="gauge" id="gDraft"><span data-i18n="freeboard">Freeboard</span> <div class="track"><div class="fill" id="fDraft" style="width:100%"></div></div> <b id="vDraft">75cm</b></div>
</div>
<main id="stage">
  <canvas id="c" tabindex="0" data-i18n-label="canvasLabel" aria-label="A dock and a cargo boat. Click the deck to drop the crate."></canvas>
  <div id="toast" data-show="0"></div>
</main>
<div id="over" hidden><div class="card" id="overCard"></div></div>
<footer class="row bottom">
  <div class="hook"><div id="cIcon"></div><div><div id="cName"></div><div class="sub" id="cSub"></div></div></div>
  <div class="spacer"></div>
  <div class="btns"><button id="bRot" class="touch-only" type="button" data-i18n="rotate">Rotate</button><button id="bGo" class="primary" type="button" data-i18n="sail">Sail</button></div>
</footer>

<script>
'use strict';
/* =====================================================================
   Dockhand — a tiny software rasteriser: orthographic camera, depth buffer,
   rotated triangles, a light-space shadow map, hue-shifted ramps with a
   Bayer screen, and outlines from object ids + depth.
   ===================================================================== */
/* the picture: 320x228 game pixels on desktop. On a narrow screen the canvas is sized at boot so each game pixel is
   about 1.33 CSS px (a whole number of device pixels) and the scene fills the width, a little larger than at 1x. */
const VIEW = (() => {
  const st = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  /* desktop: rendered at R x 320x228 when the stage gives the 1x picture at least 2 device px per game pixel,
     so the picture keeps its size and gets finer */
  if (st.width >= 560 || st.width < 200 || st.height < 200) {
    const R = Math.min(st.width * dpr / 320, st.height * dpr / 228) >= 2 ? 2 : 1;
    return { W: 320 * R, H: 228 * R, S: 21 * R, R };
  }
  const k = Math.max(1, Math.round(1.34 * dpr));
  const W = Math.floor(st.width * dpr / k), H = Math.max(160, Math.min(Math.floor(st.height * dpr / k), Math.round(W * 1.05)));
  return { W, H, S: .95 * W / 14.6, R: 1 };
})();
const W = VIEW.W, H = VIEW.H, S = VIEW.S, R = VIEW.R;
const PHI = 35 * Math.PI / 180, SP = Math.sin(PHI), CP = Math.cos(PHI), R2 = Math.SQRT1_2;
const CAM = [CP * R2, CP * R2, SP];          // toward the camera
const RT = [R2, -R2, 0];                      // screen right
const UP = [-SP * R2, -SP * R2, CP];          // screen up
const OX = W / 2 + 2 * R, OY = H / 2 - 2 * R;
const BG = [230, 236, 238];
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

    setText('vRoll', '0°'); setText('vPitch', '0°'); setText('vDraft', '—');
    $('fDraft').style.width = '0%';
    for (const id of ['gRoll', 'gPitch', 'gDraft']) $(id).classList.remove('warn');
  }
  const loading = G.phase === 'load';
  $('bGo').disabled = !loading;
}
/* text and icons snap to whole device pixels of the 12px font grid */
function snapPx(css) { const d = window.devicePixelRatio || 1; return Math.max(1, Math.round(css * d / 12)) * 12 / d; }
function iconZoom(z) { const d = window.devicePixelRatio || 1; return Math.max(1, Math.round(z * d)) / d; }
function setType() {
  const r = document.documentElement.style;
  r.setProperty('--t0', snapPx(13) + 'px'); r.setProperty('--t1', snapPx(16) + 'px'); r.setProperty('--t2', snapPx(26) + 'px');
}
setType();
addEventListener('resize', setType);
document.querySelectorAll('#gRoll .zone').forEach(z => z.style.width = (50 - 14 / 30 * 50) + '%');
document.querySelectorAll('#gPitch .zone').forEach(z => z.style.width = (50 - 10 / 22 * 50) + '%');

/* ---------- actions ---------- */
function place() {
  if (G.phase !== 'load' || !G.cur || G.fetch || !G.target || !G.target.valid) {
    if (G.target && !G.target.valid && G.phase === 'load') toast(tx(G.target.why || 'noRoom'));
    return;
  }
  const t = TYPES[G.cur.t], tg = G.target;
  G.onboard.push({ id: G.nextId++, t: G.cur.t, ci: G.cur.ci, rot: G.cur.rot, cells: tg.sh.cells, col: tg.col, row: tg.row, h: t.h, base: tg.base, drop: 1.05, vz: 0 });
  G.fetch = true;
  nextCrate();
}
function nextCrate() {
  G.cur = G.queue.shift() || null;
  G.target = null;
  if (G.mouse) retarget();
  updateHud();
}
function rotate() {
  if (!G.cur || G.phase !== 'load') return;
  G.cur.rot = (G.cur.rot + 1) % 4;
  if (G.mouse || G.aim) retarget(); else if (G.target) moveKey(0, 0);
  updateHud();
}
function depart(forced) {
  if (G.phase !== 'load') return;
  if (G.onboard.some(c => c.drop > 0)) { G.departSoon = true; return; }
  G.phase = 'leave'; G.phaseT = 0; G.target = null; G.departSoon = false; sfx('horn');
}
function retarget() {
  if (G.phase !== 'load' || !G.cur) { if (G.mouse) G.target = null; return; }
  if (G.mouse) G.target = pickCell(G.mouse[0], G.mouse[1]);
  else if (G.aim) aimTarget();
}
/* touch aims with a virtual cursor in deck coordinates (cells from the deck centre), moved by dragging anywhere */
function aimTarget() {
  const b = G.boat, sh = shapeOf(G.cur), t = TYPES[G.cur.t];
  G.aim[0] = clamp(G.aim[0], -b.B / 2, b.B / 2); G.aim[1] = clamp(G.aim[1], -b.L / 2, b.L / 2);
  const col = clamp(Math.round(G.aim[0] + b.B / 2 - sh.w / 2), 0, b.B - sh.w), row = clamp(Math.round(G.aim[1] + b.L / 2 - sh.l / 2), 0, b.L - sh.l);
  G.target = check(col, row, sh, t.h, heights());
}
function moveKey(dx, dy) {
  if (G.phase !== 'load' || !G.cur) return;
  const sh = shapeOf(G.cur), t = TYPES[G.cur.t], hg = heights(), b = G.boat;
  let col = G.target ? G.target.col : Math.floor((b.B - sh.w) / 2), row = G.target ? G.target.row : Math.floor((b.L - sh.l) / 2);
  col = clamp(col + dx, 0, b.B - sh.w); row = clamp(row + dy, 0, b.L - sh.l);
  G.mouse = null;
  G.target = check(col, row, sh, t.h, hg);
  if (G.target) G.aim = [col + sh.w / 2 - b.B / 2, row + sh.l / 2 - b.L / 2];
}

/* ---------- input ---------- */
function toCanvas(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; G.mouse = toCanvas(e); retarget(); });
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  audio(); if (ac && ac.state === 'suspended') ac.resume();
  if (e.button === 2) { rotate(); return; }
  G.mouse = toCanvas(e); retarget();
});
canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse' || e.button === 2) return; G.mouse = toCanvas(e); retarget(); place(); });
/* touch and pen: drag anywhere on the page (not on buttons or cards) to move the crane, tap to drop.
   The finger never has to cover the boat. */
let drag = null, touchHintShown = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' || drag) return;
  if (e.target.closest('button, .tip, #over')) return;
  audio(); if (ac && ac.state === 'suspended') ac.resume();
  if (G.phase !== 'load' || !G.cur) return;
  if (!G.aim) G.aim = [0, 0];
  G.mouse = null;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), aim: G.aim.slice(), moved: false };
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || G.phase !== 'load' || !G.cur) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true;
  /* screen drag → ground-plane drag (inverse of the camera), with a little gain so short swipes cross the deck */
  const k = 1.6 / (S * cssScale), a = dx * k, bb = -dy * k / SP;
  G.aim = [drag.aim[0] + (a - bb) * R2, drag.aim[1] + (-a - bb) * R2];
  aimTarget();
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const tap = !drag.moved && performance.now() - drag.t < 350;
  drag = null;
  if (tap && e.type === 'pointerup') place();
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
$('bRot').addEventListener('click', () => { audio(); rotate(); });
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { G.mouse = null; G.target = null; } });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); rotate(); }, { passive: false });
addEventListener('keydown', e => {
  if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key;
  if (!$('over').hidden) { if ((k === 'Enter' || k === ' ') && G.phase !== 'end') { closeManifest(); e.preventDefault(); } return; }
  if (k === 'r' || k === 'R') rotate();
  else if (k === 'ArrowLeft') moveKey(-1, 0); else if (k === 'ArrowRight') moveKey(1, 0);
  else if (k === 'ArrowUp') moveKey(0, 1); else if (k === 'ArrowDown') moveKey(0, -1);
  else if (k === ' ') place();
  else if (k === 'Enter') depart();
  else return;
  e.preventDefault();
});
$('bGo').addEventListener('click', () => { audio(); depart(); });
/* rules card: hover or focus on desktop, a tap toggles it on touch */
$('bRules').addEventListener('click', e => { const t = $('tip'); t.dataset.open = t.dataset.open === '1' ? '0' : '1'; e.stopPropagation(); });
addEventListener('pointerdown', e => { if (!$('tip').contains(e.target)) $('tip').dataset.open = '0'; });
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = tx(muted ? 'soundOff' : 'soundOn'); $('mute').setAttribute('aria-pressed', String(muted)); });
$('mute').textContent = tx('soundOn');
if ($('lang')) $('lang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
/* a language switch redraws everything the game wrote itself */
function onLangChange() {
  for (const k in hudCache) delete hudCache[k];
  iconKey = '';
  $('mute').textContent = tx(muted ? 'soundOff' : 'soundOn');
  if (!$('over').hidden) { if (G.phase === 'end') renderEnd(); else if (G.boat && !G.seen) showManifest(); }
  updateHud();
}

let cssScale = 1;
function fit() {
  const st = $('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  /* at most 2 CSS px per 1x game pixel: bigger stops looking like a small model */
  const k = Math.max(1, Math.min(Math.round(2 * dpr / R), Math.floor(Math.min(st.width * dpr / W, st.height * dpr / H))));
  const scale = k / dpr;
  cssScale = scale;
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
}
addEventListener('resize', fit);

/* ---------- update ---------- */
function splash(x, y, n, big) {
  for (let k = 0; k < n; k++) {
    const a = rnd() * 6.283, s = .8 + rnd() * 2.2;
    G.parts.push({ x, y, z: .05, vx: Math.cos(a) * s * .5, vy: Math.sin(a) * s * .5, vz: 2 + rnd() * 2.5, life: .6 + rnd() * .5, c: rnd() < .5 ? WATER[5] : WATER[4], big: big && rnd() < .4, g: 9 });
  }
}
function dust(p, n) {
  for (let k = 0; k < n; k++) {
    const a = rnd() * 6.283, s = .6 + rnd();
    G.parts.push({ x: p[0], y: p[1], z: p[2] + .05, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: .4 + rnd() * .6, life: .3 + rnd() * .2, c: rgb(214, 196, 160), g: 3 });
  }
}
function update(dt) {
  G.t += dt; G.phaseT += dt;
  const b = G.boat;
  if (toastT > 0 && (toastT -= dt) <= 0) $('toast').dataset.show = '0';
  if (G.hookGoal) {
    if (!G.hook) G.hook = G.hookGoal.slice();
    const k = Math.min(1, dt * 9);
    for (let i = 0; i < 3; i++) G.hook[i] = lerp(G.hook[i], G.hookGoal[i], k);
    if (G.fetch && Math.hypot(G.hook[0] - G.hookGoal[0], G.hook[1] - G.hookGoal[1], G.hook[2] - G.hookGoal[2]) < .35) { G.fetch = false; retarget(); }
  }
  if (G.phase === 'arrive') {
    const t = Math.min(1, G.phaseT / 2.4), e = 1 - Math.pow(1 - t, 3);
    b.y = lerp(-17, 0, e); b.speed = (1 - t) * 3;
    if (t >= 1) { b.speed = 0; G.phase = G.seen ? 'load' : 'manifest'; G.phaseT = 0; retarget(); }
  }
  if (G.phase === 'load' && b.spec.tide > 0) {
    G.tide -= dt;
    if (G.tide <= 0) depart(true);
  }
  if (G.departSoon && G.phase === 'load') depart(G.tide <= 0 && b.spec.tide > 0);
  for (const c of G.onboard) if (c.drop > 0) {
    c.vz -= 14 * dt; c.drop += c.vz * dt;
    if (c.drop <= 0) {
      c.drop = 0;
      const t = TYPES[c.t];
      const M = b.spec.M0 + G.onboard.reduce((s, o) => s + TYPES[o.t].m, 0);
      const [cx, cy] = centre(c);
      b.rollV += .9 * t.m * (cx - b.B / 2) / M;
      b.pitchV += .6 * t.m * (cy - b.L / 2) / M;
      dust(boatT(b)([cx - b.B / 2, cy - b.L / 2, FB + c.base * LV]), 5);
      sfx('thunk', t.m);
    }
  }
  if (b && G.phase !== 'sink') physics(dt);
  if (G.phase === 'leave') {
    b.speed = Math.min(3.2, b.speed + dt * 1.1);
    b.y += b.speed * dt;
    if (b.y > 9.5) {
      const { value, full } = boatValue();
      G.score += value; G.crates += G.onboard.length;
      G.log.push({ idx: G.boatIdx, n: G.onboard.length, value, full, lost: G.lost });
      if (value) toast(tx('paid', { v: value }) + (full ? '  ' + tx('full') : ''), 2.2);
      if (value) sfx('coin');
      nextBoat();
    }
  }
  if (G.phase === 'sink') {
    b.roll = lerp(b.roll, b.sinkDir * 1.25, Math.min(1, dt * 1.6)); b.rollV = 0;
    b.z -= dt * .5;
    if (G.phaseT > 2.6) nextBoat();
  }
  for (const f of G.falling.slice()) {
    f.vz -= 9.5 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.roll += f.wr * dt; f.pitch += f.wp * dt;
    const onDock = f.x > DOCK.x0 && f.x < DOCK.x1 && f.y > DOCK.y0 && f.y < DOCK.y1;
    if (onDock && f.z - f.hh <= DOCK.top && f.vz < 0 && f.penalty) {
      G.falling.splice(G.falling.indexOf(f), 1);
      G.dockBack.push({ t: f.c.t, ci: f.c.ci, rot: f.c.rot, x: clamp(f.x, DOCK.x0 + .7, DOCK.x1 - .7), y: f.y, id: f.c.id, life: .9 });
      sfx('thunk', 2);
    } else if (f.z < -.7) {
      G.falling.splice(G.falling.indexOf(f), 1);
      splash(f.x, f.y, 16, true); sfx('splash');
    } else if (f.z < .1 && !f.splashed) {
      f.splashed = true; splash(f.x, f.y, 10, true); f.vx *= .3; f.vy *= .3; f.vz *= .3; f.wr *= .3; f.wp *= .3;
      if (f.penalty) { const v = TYPES[f.c.t].v; G.score -= v; G.lost += v; toast(tx('lost', { v })); }
    }
  }
  for (const d of G.dockBack.slice()) if ((d.life -= dt) <= 0) {
    G.dockBack.splice(G.dockBack.indexOf(d), 1);
    if (G.phase === 'load' || G.phase === 'arrive' || G.phase === 'manifest') { if (G.cur) G.queue.unshift(G.cur); G.cur = { t: d.t, ci: d.ci, rot: 0 }; retarget(); }
  }
  for (const p of G.parts.slice()) {
    p.vz -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.life -= dt;
    if (p.life <= 0 || p.z < -.05) G.parts.splice(G.parts.indexOf(p), 1);
  }
  updateHud();
}
function nextBoat() {
  G.boatIdx++;
  G.falling = G.falling.filter(f => f.z > -.7);
  if (G.boatIdx >= BOATS.length) return endDay();
  startBoat();
}
function endDay() {
  G.phase = 'end'; G.boat = null; G.cur = null; G.queue = [];
  updateHud();
  let best = 0;
  try { best = +(localStorage.getItem('dock-best-v2') || 0); if (G.score > best) localStorage.setItem('dock-best-v2', String(G.score)); } catch (e) { best = 0; }
  G.prevBest = best;
  renderEnd();
}
function renderEnd() {
  const best = G.prevBest, card = $('overCard');
  card.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = tx('dayDone'); card.append(h);
  const ul = document.createElement('ul'); ul.className = 'ledger';
  G.log.forEach((r, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span'); a.textContent = `${i + 1} ${boatName(r.idx)}`;
    const m = document.createElement('span'); m.className = 'mid';
    m.textContent = r.sunk ? tx('sank') : tx('crates', { n: r.n }) + (r.full ? ' ' + tx('full') : '') + (r.lost ? ' ' + tx('lostShort', { n: r.lost }) : '');
    const v = document.createElement('b'); v.textContent = r.sunk ? (r.lost ? `-${r.lost}` : '0') : `+${r.value - r.lost}`;
    li.append(a, m, v); ul.append(li);
  });
  card.append(ul);
  const tot = document.createElement('p'); tot.className = 'total';
  tot.textContent = tx('total', { s: G.score }) + (G.score > best ? ' · ' + tx('newBest') : best ? ' · ' + tx('best', { b: best }) : '');
  card.append(tot);
  const btn = document.createElement('button'); btn.className = 'primary'; btn.type = 'button'; btn.textContent = tx('again');
  btn.addEventListener('click', newDay); card.append(btn);
  $('over').hidden = false; btn.focus({ preventScroll: true });
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.phase !== 'end') for (let k = 0; k < 2; k++) update(dt / 2);
  render(G.t);
  requestAnimationFrame(frame);
}
fit();
newDay();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
